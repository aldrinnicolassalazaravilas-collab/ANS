<svg width="50" height="50" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1050"/>
      <stop offset="100%" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="g_purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="g_blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="g_star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="g_shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="48" height="48" rx="11" fill="url(#g_bg)" stroke="#7c3aed" stroke-width="1"/>
  <rect x="1" y="1" width="48" height="24" rx="11" fill="url(#g_shine)"/>
  <!-- Book left page -->
  <path d="M11,39 L11,14 Q18,9 25,14 L25,35 Q18,30 11,35" fill="url(#g_purple)" stroke="#a855f7" stroke-width="0.5"/>
  <!-- Book right page -->
  <path d="M25,14 L25,35 Q32,30 39,35 L39,14 Q32,9 25,14" fill="url(#g_blue)" stroke="#3b82f6" stroke-width="0.5"/>
  <!-- Spine -->
  <line x1="25" y1="13" x2="25" y2="35" stroke="#a855f7" stroke-width="1.2" opacity="0.6"/>
  <!-- Text lines left -->
  <line x1="14" y1="18" x2="22" y2="18" stroke="#e9d5ff" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
  <line x1="14" y1="21" x2="21" y2="21" stroke="#e9d5ff" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
  <line x1="14" y1="24" x2="20" y2="24" stroke="#e9d5ff" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
  <line x1="14" y1="27" x2="19" y2="27" stroke="#e9d5ff" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
  <!-- Text lines right -->
  <line x1="28" y1="18" x2="36" y2="18" stroke="#dbeafe" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
  <line x1="28" y1="21" x2="35" y2="21" stroke="#dbeafe" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
  <line x1="28" y1="24" x2="34" y2="24" stroke="#dbeafe" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
  <line x1="28" y1="27" x2="33" y2="27" stroke="#dbeafe" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
  <!-- Star -->
  <polygon points="25,6 26.8,10 31,10.5 28,13.2 29,17.5 25,15 21,17.5 22,13.2 19,10.5 23.2,10" fill="url(#g_star)" stroke="#fbbf24" stroke-width="0.3"/>
  <!-- Data particles floating up -->
  <circle cx="16" cy="8" r="1.2" fill="#22d3ee" opacity="0.7"/>
  <circle cx="34" cy="7" r="1" fill="#a855f7" opacity="0.6"/>
  <circle cx="12" cy="11" r="0.8" fill="#4ade80" opacity="0.5"/>
  <circle cx="38" cy="10" r="0.8" fill="#fbbf24" opacity="0.5"/>
  <circle cx="20" cy="6" r="0.6" fill="#60a5fa" opacity="0.4"/>
  <circle cx="30" cy="5" r="0.7" fill="#f472b6" opacity="0.4"/>
  <line x1="16" y1="12" x2="16" y2="10" stroke="#22d3ee" stroke-width="0.5" opacity="0.5"/>
  <line x1="34" y1="11" x2="34" y2="9" stroke="#a855f7" stroke-width="0.5" opacity="0.5"/>
</svg>
