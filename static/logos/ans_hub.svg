<svg width="50" height="50" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="h_bg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </radialGradient>
    <radialGradient id="h_glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="white" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#93c5fd" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h_core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="white"/>
      <stop offset="60%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </radialGradient>
    <linearGradient id="h_blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="h_green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="h_purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <circle cx="25" cy="25" r="24" fill="url(#h_bg)" stroke="#2d4a7a" stroke-width="0.8"/>
  <circle cx="25" cy="25" r="22" fill="none" stroke="#3b82f6" stroke-width="0.3" opacity="0.2"/>
  <!-- Outer glow -->
  <circle cx="25" cy="25" r="10" fill="url(#h_glow)"/>
  <!-- Orbit rings -->
  <ellipse cx="25" cy="25" rx="15" ry="15" fill="none" stroke="#60a5fa" stroke-width="0.5" opacity="0.2" stroke-dasharray="2,4"/>
  <ellipse cx="25" cy="25" rx="12" ry="12" fill="none" stroke="#4ade80" stroke-width="0.4" opacity="0.15" stroke-dasharray="1.5,3"/>
  <!-- Connection lines -->
  <line x1="25" y1="17" x2="25" y2="21" stroke="#60a5fa" stroke-width="0.8" opacity="0.4"/>
  <line x1="29.5" y1="28.5" x2="33" y2="31" stroke="#4ade80" stroke-width="0.8" opacity="0.4"/>
  <line x1="20.5" y1="28.5" x2="17" y2="31" stroke="#a855f7" stroke-width="0.8" opacity="0.4"/>
  <!-- Core -->
  <circle cx="25" cy="25" r="5" fill="url(#h_core)"/>
  <circle cx="25" cy="25" r="3" fill="white"/>
  <circle cx="25" cy="25" r="5" fill="none" stroke="white" stroke-width="0.5" opacity="0.4"/>
  <circle cx="25" cy="25" r="7" fill="none" stroke="white" stroke-width="0.3" opacity="0.15"/>
  <!-- Orbital nodes -->
  <circle cx="25" cy="12" r="3.5" fill="url(#h_blue)" stroke="#dbeafe" stroke-width="0.5"/>
  <circle cx="25" cy="12" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="34" cy="30" r="3.5" fill="url(#h_green)" stroke="#bbf7d0" stroke-width="0.5"/>
  <circle cx="34" cy="30" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="16" cy="30" r="3.5" fill="url(#h_purple)" stroke="#e9d5ff" stroke-width="0.5"/>
  <circle cx="16" cy="30" r="1.5" fill="white" opacity="0.8"/>
  <!-- Node glows -->
  <circle cx="25" cy="12" r="6" fill="#60a5fa" opacity="0.1"/>
  <circle cx="34" cy="30" r="6" fill="#4ade80" opacity="0.1"/>
  <circle cx="16" cy="30" r="6" fill="#a855f7" opacity="0.1"/>
</svg>
