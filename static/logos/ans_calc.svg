  <text x="12" y="16" fill="#57a6ff" font-family="monospace" font-size="8" font-weight="bold" letter-spacing="1">ANS</text>
  <text x="40" y="16" fill="#4ade80" font-family="monospace" font-size="6" text-anchor="end">=0</text>
