<svg width="50" height="50" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="e_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="e_blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="e_green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="e_shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="48" height="48" rx="11" fill="url(#e_bg)" stroke="#2d4a7a" stroke-width="1"/>
  <rect x="1" y="1" width="48" height="24" rx="11" fill="url(#e_shine)"/>
  <!-- Envelope body -->
  <rect x="8" y="15" width="34" height="22" rx="4" fill="white"/>
  <rect x="8" y="15" width="34" height="22" rx="4" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
  <!-- Envelope flap -->
  <polygon points="8,15 25,28 42,15" fill="url(#e_blue)" opacity="0.95"/>
  <polygon points="8,15 25,28 42,15" fill="none" stroke="#93c5fd" stroke-width="0.3"/>
  <!-- Envelope bottom fold -->
  <path d="M8,37 L20,28 L25,31 L30,28 L42,37" fill="#e2e8f0" opacity="0.4"/>
  <!-- Envelope lines -->
  <line x1="12" y1="22" x2="22" y2="22" stroke="#cbd5e1" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="12" y1="26" x2="20" y2="26" stroke="#cbd5e1" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="12" y1="30" x2="18" y2="30" stroke="#cbd5e1" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Notification badge -->
  <circle cx="38" cy="16" r="8" fill="url(#e_green)" stroke="#bbf7d0" stroke-width="0.8"/>
  <circle cx="38" cy="16" r="7" fill="none" stroke="#bbf7d0" stroke-width="0.3" opacity="0.5"/>
  <path d="M35,16 L41,16 M38,13 L38,19" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Depth shadow inside envelope -->
  <rect x="10" y="27" width="12" height="1.5" rx="1" fill="#cbd5e1" opacity="0.3"/>
</svg>
