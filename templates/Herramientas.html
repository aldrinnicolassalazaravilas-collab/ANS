<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Herramientas de ANS</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 20px;background:#0d1522;border-bottom:1px solid #1a2744}
        .toolbar .tokens{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fbbf24;background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.2)}
        .cuadro{position:relative;overflow:visible}
        .mision-badge{position:absolute;top:-6px;right:-6px;font-size:10px;padding:2px 6px;border-radius:999px;font-weight:700;z-index:2;white-space:nowrap}
        .mision-badge.available{background:#fbbf24;color:#0f1624}
        .mision-badge.done{background:#22c55e;color:#0f1624}
        .mision-badge.na{display:none}
        @media(max-width:600px){.toolbar{padding:8px 12px}}
    </style>
</head>
<body>
    <header>
        <h1>🔨 Herramientas disponibles</h1>
        <div class="toolbar">
            <span class="tokens" id="token-header">🪙 <span id="token-count">-</span></span>
        </div>
    </header>
    <div class="contenedor">
        <div class="cuadro" data-mission="">
            <img src="/static/logos/ans_ai.svg">
            <p>ANS AI</p>
            <button onclick="location.href='/AI-worspase'">ir</button>
        </div>

        <div class="cuadro" data-mission="use_calc">
            <img src="/static/logos/ans_calc.svg">
            <p>ANS Calc</p>
            <button onclick="location.href='/calc'">ir</button>
        </div>
        <div class="cuadro" data-mission="use_convert">
            <img src="/static/logos/ans_convert.svg">
            <p>ANS Convert</p>
            <button onclick="location.href='/convert'">ir</button>
        </div>
        <div class="cuadro" data-mission="use_mail">
            <img src="/static/logos/ans_mail.svg">
            <p>ANS Mail</p>
            <button onclick="location.href='/mail'">ir</button>
        </div>
        <div class="cuadro" data-mission="">
            <img src="/static/logos/ans_hub.svg">
            <p>Contacto</p>
            <button onclick="location.href='/contacto'">ir</button>
        </div>
        <div class="cuadro" data-mission="use_draw">
            <img src="/static/logos/ans_draw.svg">
            <p>ANS Draw</p>
            <button onclick="location.href='/app/draw'">ir</button>
        </div>
        <div class="cuadro" data-mission="use_notes">
            <img src="/static/logos/ans_notes.svg">
            <p>ANS Notes</p>
            <button onclick="location.href='/app/notes'">ir</button>
        </div>
        <div class="cuadro" data-mission="use_weather">
            <img src="/static/logos/ans_weather.svg">
            <p>ANS Weather</p>
            <button onclick="location.href='/app/weather'">ir</button>
        </div>
        <div class="cuadro" data-mission="use_scan">
            <img src="/static/logos/ans_scan.svg">
            <p>ANS Scan</p>
            <button onclick="location.href='/app/scan'">ir</button>
        </div>
        <div class="cuadro" data-mission="use_wallet">
            <img src="/static/logos/ans_wallet.svg">
            <p>ANS Wallet</p>
            <button onclick="location.href='/app/wallet'">ir</button>
        </div>
        <div class="cuadro" data-mission="use_music">
            <img src="/static/logos/ans_music.svg">
            <p>ANS Music</p>
            <button onclick="location.href='/app/music'">ir</button>
        </div>
        <div class="cuadro" data-mission="use_maps">
            <img src="/static/logos/ans_maps.svg">
            <p>ANS Maps</p>
            <button onclick="location.href='/app/maps'">ir</button>
        </div>
        <div class="cuadro" data-mission="use_games">
            <img src="/static/logos/ans_games.svg">
            <p>ANS Games</p>
            <button onclick="location.href='/games'">ir</button>
        </div>
        <div class="cuadro" data-mission="use_backup">
            <img src="/static/logos/ans_backup.svg">
            <p>ANS Backup</p>
            <button onclick="location.href='/app/backup'">ir</button>
        </div>
    </div>
    <script>
        (async function() {
            try {
                const r = await fetch('/api/tokens');
                const d = await r.json();
                if (d) {
                    document.getElementById('token-count').textContent = d.balance;
                    const completed = d.missions || {};
                    document.querySelectorAll('[data-mission]').forEach(el => {
                        const mid = el.getAttribute('data-mission');
                        if (!mid) return;
                        const badge = document.createElement('span');
                        badge.className = 'mision-badge';
                        if (completed[mid]) {
                            badge.className += ' done';
                            badge.textContent = '✅';
                        } else {
                            badge.className += ' available';
                            badge.textContent = '🎯 mision';
                        }
                        el.style.position = 'relative';
                        el.appendChild(badge);
                    });
                }
            } catch(e) {}
        })();
    </script>
</body>
</html>
