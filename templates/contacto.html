<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | ANS AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #070b14; --panel: #0f1624; --line: rgba(120,145,180,0.15); --text: #e8eef8; --muted: #98a8c3; --accent: #57a6ff; --accent-2: #34d399; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh; display: grid; place-items: center;
            background: radial-gradient(circle at top left, rgba(87,166,255,0.18), transparent 30%), radial-gradient(circle at bottom right, rgba(52,211,153,0.12), transparent 28%), linear-gradient(180deg, #050810 0%, #090d16 100%);
            font-family: "Inter", sans-serif; padding: 20px;
        }
        .card {
            width: 100%; max-width: 480px; background: linear-gradient(180deg, rgba(19,28,47,0.95), rgba(10,15,26,0.95));
            border: 1px solid var(--line); border-radius: 28px; padding: 36px 28px; box-shadow: 0 32px 80px rgba(0,0,0,0.5);
            animation: cardIn .5s cubic-bezier(.4,0,.2,1);
        }
        @keyframes cardIn { from { opacity: 0; transform: translateY(20px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
        h1 { font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 6px; background: linear-gradient(135deg, #57a6ff, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .sub { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
        label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
        input, textarea, select {
            width: 100%; padding: 12px 16px; border-radius: 12px; border: 1.5px solid rgba(255,255,255,0.08);
            background: rgba(0,0,0,0.2); color: var(--text); font-size: 14px; font-family: inherit;
            outline: none; transition: border-color .3s; margin-bottom: 16px;
        }
        input:focus, textarea:focus { border-color: rgba(87,166,255,0.6); }
        textarea { min-height: 120px; resize: vertical; }
        select option { background: #0f1624; color: var(--text); }
        button {
            width: 100%; padding: 14px; border-radius: 14px; border: none;
            background: linear-gradient(135deg, #57a6ff, #7cdbff); color: #06111f;
            font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer;
            transition: all .25s; box-shadow: 0 8px 24px rgba(87,166,255,0.25);
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(87,166,255,0.4); }
        button:active { transform: scale(.97); }
        button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
        .back { display: block; text-align: center; margin-top: 18px; color: var(--muted); font-size: 13px; text-decoration: none; }
        .back:hover { color: var(--accent); }
        .success { display: none; text-align: center; padding: 20px; color: var(--accent-2); font-weight: 600; }
        .error { color: #ff6b6b; font-size: 12px; margin-top: -12px; margin-bottom: 12px; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Contacto</h1>
        <p class="sub">Enviamos tus sugerencias, comentarios o reportes</p>
        <form id="contact-form">
            <label>Tu nombre</label>
            <input type="text" id="name" placeholder="Como te llamas" autocomplete="name">
            <label>Tu email (opcional)</label>
            <input type="email" id="email" placeholder="email@ejemplo.com" autocomplete="email">
            <label>Tipo</label>
            <select id="type">
                <option value="sugerencia">Sugerencia</option>
                <option value="reporte">Reporte de error</option>
                <option value="idea">Idea para mejorar</option>
                <option value="otro">Otro</option>
            </select>
            <label>Mensaje</label>
            <textarea id="message" placeholder="Escribe tu mensaje..." required></textarea>
            <div class="error" id="error-msg">Escribe un mensaje primero</div>
            <button type="submit" id="send-btn">Enviar mensaje</button>
            <div class="success" id="success-msg">Gracias! Tu mensaje fue enviado al administrador.</div>
        </form>
        <a href="/AI-worspase" class="back">Volver al AI workspace</a>
    </div>
    <script>
        document.getElementById('contact-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('message').value.trim();
            if (!msg) { document.getElementById('error-msg').style.display = 'block'; return; }
            document.getElementById('error-msg').style.display = 'none';
            const btn = document.getElementById('send-btn');
            btn.disabled = true; btn.textContent = 'Enviando...';
            try {
                const r = await fetch('/api/contact', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
                    name: document.getElementById('name').value.trim() || 'Anonimo',
                    email: document.getElementById('email').value.trim(),
                    message: msg,
                    type: document.getElementById('type').value,
                })});
                const d = await r.json();
                if (d.ok) {
                    document.getElementById('contact-form').style.display = 'none';
                    document.getElementById('success-msg').style.display = 'block';
                } else {
                    document.getElementById('error-msg').textContent = d.error || 'Error al enviar';
                    document.getElementById('error-msg').style.display = 'block';
                    btn.disabled = false; btn.textContent = 'Enviar mensaje';
                }
            } catch(e) {
                document.getElementById('error-msg').textContent = 'Error de conexion';
                document.getElementById('error-msg').style.display = 'block';
                btn.disabled = false; btn.textContent = 'Enviar mensaje';
            }
        });
    </script>
</body>
</html>
