<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><title>ANS Music</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1624;color:#e2e8f0;font-family:'Poppins',sans-serif;height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:#1a2744;border-bottom:1px solid #2d4a7a}
header img{width:28px;height:28px}
header h1{font-size:17px;font-weight:600;flex:1}
header a{color:#57a6ff;text-decoration:none;font-size:12px}
.music-container{display:flex;flex:1;overflow:hidden}
.sidebar{width:300px;background:#111b28;border-right:1px solid #1a2744;display:flex;flex-direction:column;flex-shrink:0}
.sidebar .upload-area{padding:12px;border-bottom:1px solid #1a2744}
.sidebar .upload-area .drop{border:2px dashed #2d4a7a;border-radius:10px;padding:16px;text-align:center;cursor:pointer;font-size:12px;color:#98a8c3;transition:.2s}
.sidebar .upload-area .drop:hover{border-color:#a855f7;background:#0a0f1a}
.sidebar .upload-area .drop.dragover{border-color:#22c55e;background:#0a0f1a}
.sidebar .search-area{padding:8px 12px;border-bottom:1px solid #1a2744}
.sidebar .search-area input{width:100%;padding:8px 12px;border-radius:8px;border:none;background:#1a2744;color:#e2e8f0;font-size:12px;outline:none}
.sidebar .search-area input::placeholder{color:#4a5568}
.playlist{flex:1;overflow-y:auto}
.track{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;border-bottom:1px solid #1a2744;transition:.15s}
.track:hover{background:#1a2744}
.track.act{background:#a855f733;border-left:3px solid #a855f7}
.track .icon{font-size:22px;width:30px;text-align:center;flex-shrink:0}
.track .info{flex:1;min-width:0}
.track .info .name{font-size:13px;font-weight:500;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.track .info .name .rename-btn{font-size:10px;color:#98a8c3;cursor:pointer;background:none;border:none;padding:2px 4px}
.track .info .name .rename-btn:hover{color:#57a6ff}
.track .info .artist{font-size:11px;color:#98a8c3;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.track .info .artist .del-btn{font-size:10px;color:#ef4444;cursor:pointer;background:none;border:none;padding:2px 4px;opacity:0}
.track:hover .info .artist .del-btn{opacity:1}
.player-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:#0a0f1a;min-width:0}
.cover-art{width:160px;height:160px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:64px;background:#1a2744;border:1px solid #2d4a7a;margin-bottom:16px;flex-shrink:0}
.now-name{font-size:18px;font-weight:600;margin-bottom:2px;text-align:center;word-wrap:break-word;max-width:100%}
.now-artist{font-size:13px;color:#98a8c3;margin-bottom:16px;text-align:center}
.controls{display:flex;align-items:center;gap:20px;margin-bottom:12px}
.controls button{width:44px;height:44px;border-radius:50%;border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.controls .play-pause{width:56px;height:56px;font-size:22px;background:#a855f7;color:white}
.controls .play-pause:hover{background:#7c3aed}
.controls .skip{background:#1a2744;color:#e2e8f0;border:1px solid #2d4a7a!important}
.progress-container{width:100%;max-width:360px;margin-bottom:6px;padding:0 8px}
.progress-bar{width:100%;height:4px;background:#2d4a7a;border-radius:2px;cursor:pointer;position:relative}
.progress-fill{height:100%;background:#a855f7;border-radius:2px;width:0%;transition:width .1s}
.time-row{display:flex;justify-content:space-between;width:100%;max-width:360px;font-size:11px;color:#98a8c3;margin-bottom:12px;padding:0 8px}
.volume-row{display:flex;align-items:center;gap:8px;font-size:12px;padding:0 8px}
.volume-row input{width:100px}
.uploaded-tag{display:inline-block;font-size:9px;padding:1px 6px;border-radius:8px;background:#22c55e33;color:#22c55e}
.empty-tracklist{text-align:center;padding:40px 20px;color:#4a5568;font-size:13px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1a2744;color:#e2e8f0;padding:10px 20px;border-radius:10px;font-size:13px;border:1px solid #2d4a7a;display:none;z-index:99;max-width:90%;text-align:center}
@media(max-width:768px){
.music-container{flex-direction:column}.sidebar{width:100%;max-height:40vh;border-right:none;border-bottom:1px solid #2d4a7a}
.player-area{padding:16px}.cover-art{width:120px;height:120px;font-size:48px}.now-name{font-size:16px}
.controls button{width:40px;height:40px;font-size:16px}.controls .play-pause{width:50px;height:50px;font-size:20px}
header{padding:10px 12px}
}
</style>
</head>
<body>
<header>
<img src="/static/logos/ans_music.svg" alt="Music"><h1>ANS Music</h1>
<a href="/herramientas">← Herramientas</a>
</header>
<div class="music-container">
<div class="sidebar">
<div class="upload-area">
<form id="upload-form" enctype="multipart/form-data" style="display:contents">
<div class="drop" id="drop-zone" onclick="document.getElementById('file-input').click()">
📁 <b>Subir música</b><br>MP3, WAV, OGG — visible para todos
</div>
<input type="file" id="file-input" accept="audio/*" style="display:none" onchange="uploadFile(this.files[0])">
</form>
</div>
<div class="search-area"><input id="search-input" placeholder="🔍 Buscar canciones..." oninput="renderPlaylist()"></div>
<div class="playlist" id="playlist"><div class="empty-tracklist">🎵 Cargando canciones...</div></div>
</div>
<div class="player-area">
<div class="cover-art" id="cover-art">🎵</div>
<div class="now-name" id="now-name">Selecciona una canción</div>
<div class="now-artist" id="now-artist">ANS Music</div>
<audio id="audio" ontimeupdate="updateProgress()" onended="nextTrack()" onloadedmetadata="updateDuration()"></audio>
<div class="controls">
<button class="skip" onclick="prevTrack()">⏮</button>
<button class="play-pause" id="play-btn" onclick="togglePlay()">▶</button>
<button class="skip" onclick="nextTrack()">⏭</button>
</div>
<div class="progress-container">
<div class="progress-bar" onclick="seek(event)">
<div class="progress-fill" id="progress-fill"></div>
</div>
</div>
<div class="time-row"><span id="current-time">0:00</span><span id="total-time">0:00</span></div>
<div class="volume-row">🔊 <input type="range" min="0" max="1" step="0.05" value="0.5" oninput="audio.volume=this.value"></div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
const audio=document.getElementById('audio');
let tracks=[];
let current=0,playing=false;
const demo=[{id:'demo1',name:'Ambient Waves',artist:'ANS Studio',icon:'🌊',url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3',demo:true},{id:'demo2',name:'Summer Vibes',artist:'ANS Studio',icon:'☀️',url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3',demo:true},{id:'demo3',name:'Night Drive',artist:'ANS Studio',icon:'🌙',url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3',demo:true},{id:'demo4',name:'Electric Dreams',artist:'ANS Studio',icon:'⚡',url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3',demo:true},{id:'demo5',name:'Deep Focus',artist:'ANS Studio',icon:'🧠',url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3',demo:true}];

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>{t.style.display='none'},3000)}

async function loadTracks(){
try{
const r=await fetch('/api/music/tracks');
const d=await r.json();
if(d&&d.tracks){
tracks=[...demo,...d.tracks.map(t=>({
id:t.id,name:t.name,artist:t.artist,icon:'🎵',url:'/api/music/serve/'+t.filename,uploaded:true,fileId:t.id,server:true
}))];
renderPlaylist();
if(tracks.length>0)loadTrack(current)
}}catch(e){tracks=[...demo];renderPlaylist();if(tracks.length>0)loadTrack(current)}
}

async function uploadFile(file){
if(!file)return;
const ext=file.name.split('.').pop().toLowerCase();
if(ext==='mp4'||ext==='mov'||ext==='avi'){
if(confirm('🎬 Video detectado. ¿Ir a ANS Convert?')){window.location.href='/convert'}
return}
if(!['mp3','wav','ogg','flac','aac','m4a'].includes(ext)){alert('Formato no soportado');return}
// Preguntar nombre
let name=prompt('Nombre para la canción:',file.name.replace(/\.[^.]+$/,''));
if(name===null)return;
name=name.trim()||file.name.replace(/\.[^.]+$/,'');
const fd=new FormData();
fd.append('file',file);
fd.append('name',name);
try{
const r=await fetch('/api/music/upload',{method:'POST',body:fd});
const d=await r.json();
if(d&&d.track){
toast('✅ '+d.track.name+' subida correctamente');
await loadTracks();
fetch('/api/tokens/complete-mission',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mission:'use_music'})}).catch(()=>{});
// Seleccionar la nueva
const idx=tracks.findIndex(t=>t.id===d.track.id);
if(idx>=0){current=idx;saveCurrent();loadTrack(current);playing=true;audio.play().catch(()=>{});document.getElementById('play-btn').textContent='⏸'}
}else{alert('Error: '+(d.error||'desconocido'))}
}catch(e){alert('Error de red: '+e.message)}
}

// Drag & drop
const dropZone=document.getElementById('drop-zone');
dropZone.ondragover=e=>{e.preventDefault();dropZone.classList.add('dragover')};
dropZone.ondragleave=()=>dropZone.classList.remove('dragover');
dropZone.ondrop=e=>{e.preventDefault();dropZone.classList.remove('dragover');uploadFile(e.dataTransfer.files[0])};

let savedCurrent=parseInt(localStorage.getItem('ans_music_current')||'0');

function saveCurrent(){localStorage.setItem('ans_music_current',current)}

function loadTrack(i){
if(i<0||i>=tracks.length)return;
current=i;saveCurrent();
const t=tracks[current];
if(!t)return;
document.getElementById('cover-art').textContent=t.icon||'🎵';
document.getElementById('now-name').textContent=t.name;
document.getElementById('now-artist').textContent=(t.artist||'')+(t.uploaded?' <span class="uploaded-tag">Subido</span>':'');
audio.src=t.url||'';audio.load();
renderPlaylist();
if(playing){audio.play().catch(()=>{});document.getElementById('play-btn').textContent='⏸'}else{document.getElementById('play-btn').textContent='▶'}}

function togglePlay(){
if(!audio.src)return;
if(audio.paused){audio.play().catch(()=>{});playing=true;document.getElementById('play-btn').textContent='⏸'}else{audio.pause();playing=false;document.getElementById('play-btn').textContent='▶'}}

function nextTrack(){let i=(current+1)%tracks.length;while(i!==current&&tracks[i]._hidden)i=(i+1)%tracks.length;loadTrack(i)}
function prevTrack(){let i=(current-1+tracks.length)%tracks.length;while(i!==current&&tracks[i]._hidden)i=(i-1+tracks.length)%tracks.length;loadTrack(i)}

function updateProgress(){
const p=(audio.currentTime/audio.duration)*100||0;
document.getElementById('progress-fill').style.width=p+'%';
document.getElementById('current-time').textContent=formatTime(audio.currentTime)}
function updateDuration(){document.getElementById('total-time').textContent=formatTime(audio.duration)}
function formatTime(s){if(!s||!isFinite(s))return'0:00';const m=Math.floor(s/60);const sec=Math.floor(s%60);return m+':'+String(sec).padStart(2,'0')}
function seek(e){const r=e.currentTarget.getBoundingClientRect();const p=(e.clientX-r.left)/r.width;audio.currentTime=p*audio.duration}

async function renameTrack(tid){
const t=tracks.find(x=>x.id===tid);
if(!t)return;
const name=prompt('Nuevo nombre:',t.name);
if(!name||!name.trim()||name.trim()===t.name)return;
if(t.demo){toast('No puedes renombrar canciones demo');return}
try{
const r=await fetch('/api/music/tracks/'+tid,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.trim()})});
const d=await r.json();
if(d&&d.track){t.name=d.track.name;renderPlaylist();if(current===tracks.indexOf(t))document.getElementById('now-name').textContent=t.name;toast('✏️ Nombre actualizado');fetch('/api/tokens/complete-mission',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mission:'use_music'})}).catch(()=>{})}
else{alert('Error: '+(d.error||'desconocido'))}
}catch(e){alert('Error: '+e.message)}
}

async function deleteTrack(tid){
const t=tracks.find(x=>x.id===tid);
if(!t||t.demo)return;
if(!confirm('¿Eliminar "'+t.name+'"?'))return;
try{
const r=await fetch('/api/music/tracks/'+tid,{method:'DELETE'});
const d=await r.json();
if(d&&d.ok){toast('🗑 Eliminada');await loadTracks()}
else{alert('Error al eliminar')}
}catch(e){alert('Error: '+e.message)}
}

function renderPlaylist(){
const q=document.getElementById('search-input').value.toLowerCase().trim();
const l=document.getElementById('playlist');l.innerHTML='';
const filtered=tracks.filter(t=>{
if(!q)return true;
return t.name.toLowerCase().includes(q)||(t.artist||'').toLowerCase().includes(q)
});
tracks.forEach(t=>{t._hidden=!filtered.includes(t)});
if(filtered.length===0){l.innerHTML='<div class="empty-tracklist">😕 No se encontraron canciones</div>';return}
filtered.forEach(t=>{
const idx=tracks.indexOf(t);
const d=document.createElement('div');d.className='track'+(idx===current?' act':'');
const isDemo=t.demo;
d.innerHTML=`<div class="icon">${t.icon||'🎵'}</div><div class="info"><div class="name">${t.name}${t.uploaded?'<span class="uploaded-tag">Subido</span>':''}<button class="rename-btn" onclick="event.stopPropagation();renameTrack('${t.id}')">✏️</button></div><div class="artist">${t.artist||''}${!isDemo?'<button class="del-btn" onclick="event.stopPropagation();deleteTrack(\''+t.id+'\')">🗑</button>':''}</div></div>`;
d.onclick=()=>{current=idx;saveCurrent();loadTrack(idx);if(!playing){playing=true;audio.play().catch(()=>{});document.getElementById('play-btn').textContent='⏸'}};l.appendChild(d)})}

loadTracks();
</script>
</body>
</html>
