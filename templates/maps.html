<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><title>ANS Maps</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1624;color:#e2e8f0;font-family:'Poppins',sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:16px 24px;background:#1a2744;border-bottom:1px solid #2d4a7a}
header img{width:32px;height:32px}
header h1{font-size:18px;font-weight:600;flex:1}
header a{color:#57a6ff;text-decoration:none;font-size:13px}
.content{max-width:800px;margin:20px auto;padding:20px}
#map{width:100%;height:400px;border-radius:14px;overflow:hidden;border:1px solid #2d4a7a}
.search{display:flex;gap:8px;margin-bottom:12px}
.search input{flex:1;padding:12px;border-radius:10px;border:1px solid #2d4a7a;background:#0a0f1a;color:#e2e8f0;font-size:14px;outline:none}
.search input:focus{border-color:#3b82f6}
.search button{padding:12px 24px;border-radius:10px;border:none;background:#3b82f6;color:white;font-weight:600;cursor:pointer}
.search button:hover{background:#2563eb}
.places{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.places button{padding:8px 16px;border-radius:8px;border:1px solid #2d4a7a;background:#1a2744;color:#e2e8f0;cursor:pointer;font-size:13px}
.places button:hover{border-color:#3b82f6}
.coords{text-align:center;font-size:12px;color:#98a8c3;margin-top:8px}
</style>
</head>
<body>
<header>
<img src="/static/logos/ans_maps.svg" alt="Maps"><h1>ANS Maps</h1>
<a href="/herramientas">← Herramientas</a>
</header>
<div class="content">
<div class="search">
<input id="search-input" placeholder="Buscar lugar..." value="Buenos Aires">
<button onclick="searchPlace()">🔍 Buscar</button>
</div>
<div class="places">
<button onclick="goPlace(-34.61,-58.38,'Buenos Aires')">🇦🇷 Buenos Aires</button>
<button onclick="goPlace(40.71,-74.01,'New York')">🗽 New York</button>
<button onclick="goPlace(48.86,2.35,'Paris')">🗼 París</button>
<button onclick="goPlace(35.68,139.69,'Tokyo')">🗾 Tokio</button>
<button onclick="goPlace(-33.87,151.21,'Sydney')">🦘 Sídney</button>
<button onclick="goPlace(19.43,-99.13,'Mexico City')">🌮 Ciudad de México</button>
</div>
<div id="map"></div>
<div class="coords" id="coords">🌍 Mapa interactivo — haz clic para ver coordenadas</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([-34.61,-58.38],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:18}).addTo(map);
let marker;
map.on('click',e=>{
const {lat,lng}=e.latlng;
document.getElementById('coords').textContent=`📍 ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
if(marker)map.removeLayer(marker);
marker=L.marker([lat,lng]).addTo(map).bindPopup(`<b>${lat.toFixed(4)}, ${lng.toFixed(4)}</b>`).openPopup()
});
function goPlace(lat,lng,name){
map.setView([lat,lng],12);
if(marker)map.removeLayer(marker);
marker=L.marker([lat,lng]).addTo(map).bindPopup(`<b>${name}</b>`).openPopup();
document.getElementById('coords').textContent=`📍 ${name} — ${lat.toFixed(4)}, ${lng.toFixed(4)}`
}
function searchPlace(){
const q=document.getElementById('search-input').value.trim();
if(!q)return;
fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&q='+encodeURIComponent(q))
.then(r=>r.json()).then(data=>{
if(data&&data.length>0){goPlace(parseFloat(data[0].lat),parseFloat(data[0].lon),data[0].display_name.split(',')[0])}
else alert('No se encontró el lugar')
fetch('/api/tokens/complete-mission',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mission:'use_maps'})}).catch(()=>{})
}).catch(()=>alert('Error al buscar'))
}
</script>
</body>
</html>
