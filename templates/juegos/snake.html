<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><title>Snake - ANS Games</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1624;color:#e2e8f0;font-family:'Poppins',sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:16px 24px;background:#1a2744;border-bottom:1px solid #2d4a7a}
header img{width:32px;height:32px}
header h1{font-size:18px;font-weight:600;flex:1}
header a{color:#57a6ff;text-decoration:none;font-size:13px}
.content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
canvas{border:2px solid #2d4a7a;border-radius:14px;background:#0a0f1a}
.status{font-size:18px;margin-bottom:12px}
.score-text{font-size:14px;color:#98a8c3;margin-bottom:4px}
.reset{padding:10px 28px;border-radius:10px;border:none;background:#22c55e;color:white;font-weight:600;cursor:pointer;font-size:14px;margin-top:12px}
.controls-hint{font-size:12px;color:#4a5568;margin-top:8px}
</style>
</head>
<body>
<header>
<img src="/static/logos/ans_games.svg" alt="Games"><h1>🐍 Snake</h1>
<a href="/games">← Panel</a>
</header>
<div class="content">
<div class="status" id="status">🐍 Presiona una tecla para empezar</div>
<div class="score-text">Puntuación: <b id="score" style="color:#22c55e;font-size:22px">0</b></div>
<canvas id="snake-canvas" width="400" height="400"></canvas>
<button class="reset" onclick="initSnake()">🔄 Reiniciar</button>
<div class="controls-hint">↑ ↓ ← → para mover</div>
</div>
<script>
const canvas=document.getElementById('snake-canvas');
const ctx=canvas.getContext('2d');
const SIZE=20,COLS=20,ROWS=20;
let snake,dir,food,gameOver,snakeInt,snakeScore,started=false;
function initSnake(){
clearInterval(snakeInt);snake=[[10,10]];dir=[1,0];gameOver=false;snakeScore=0;started=false;
document.getElementById('score').textContent='0';document.getElementById('status').textContent='🐍 Presiona una tecla para empezar';spawnFood();draw()}
async function completeGameMission(){try{await fetch('/api/tokens/complete-mission',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mission:'use_games'})})}catch(e){}}
function spawnFood(){while(true){const f=[Math.floor(Math.random()*COLS),Math.floor(Math.random()*ROWS)];if(!snake.some(s=>s[0]===f[0]&&s[1]===f[1])){food=f;break}}}
function draw(){ctx.fillStyle='#0a0f1a';ctx.fillRect(0,0,canvas.width,canvas.height)
snake.forEach((s,i)=>{ctx.fillStyle=i===0?'#22c55e':'#4ade80';ctx.fillRect(s[0]*SIZE+1,s[1]*SIZE+1,SIZE-2,SIZE-2);if(i===0){ctx.fillStyle='white';ctx.fillRect(s[0]*SIZE+6,s[1]*SIZE+4,3,3);ctx.fillRect(s[0]*SIZE+12,s[1]*SIZE+4,3,3)}})
ctx.fillStyle='#ef4444';ctx.fillRect(food[0]*SIZE+2,food[1]*SIZE+2,SIZE-4,SIZE-4)}
function update(){if(gameOver||!started)return;const h=snake[0],n=[h[0]+dir[0],h[1]+dir[1]];
if(n[0]<0||n[0]>=COLS||n[1]<0||n[1]>=ROWS||snake.some(s=>s[0]===n[0]&&s[1]===n[1])){gameOver=true;clearInterval(snakeInt);document.getElementById('status').textContent='💀 Game Over! Puntuación: '+snakeScore;const cur=parseInt(localStorage.getItem('ans_score_snake')||'0');if(snakeScore>cur)localStorage.setItem('ans_score_snake',snakeScore);completeGameMission();return}
snake.unshift(n);if(n[0]===food[0]&&n[1]===food[1]){snakeScore++;document.getElementById('score').textContent=snakeScore;document.getElementById('status').textContent='🐍 Puntuación: '+snakeScore;spawnFood()}else snake.pop();draw()}
document.addEventListener('keydown',e=>{const k=e.key;if(!started&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k)){started=true;document.getElementById('status').textContent='🐍 Jugando...';snakeInt=setInterval(update,130)}
const nd=dir;if(k==='ArrowUp'&&nd[1]!==1)dir=[0,-1];if(k==='ArrowDown'&&nd[1]!==-1)dir=[0,1];if(k==='ArrowLeft'&&nd[0]!==1)dir=[-1,0];if(k==='ArrowRight'&&nd[0]!==-1)dir=[1,0]});
initSnake()
</script>
</body>
</html>
