<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><title>Tres en Línea - ANS Games</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1624;color:#e2e8f0;font-family:'Poppins',sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:16px 24px;background:#1a2744;border-bottom:1px solid #2d4a7a}
header img{width:32px;height:32px}
header h1{font-size:18px;font-weight:600;flex:1}
header a{color:#57a6ff;text-decoration:none;font-size:13px}
.content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.status{font-size:18px;margin-bottom:16px;color:#98a8c3}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:280px}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:700;background:#1a2744;border:2px solid #2d4a7a;border-radius:14px;cursor:pointer;transition:.15s}
.cell:hover{border-color:#ef4444;background:#2d4a7a}
.cell.taken{cursor:default}
.cell.taken:hover{border-color:#2d4a7a}
.score{display:flex;gap:32px;margin-bottom:16px;font-size:15px}
.score span{color:#98a8c3}
.score b{font-size:24px}
#score-x{color:#ef4444}#score-o{color:#22c55e}#score-d{color:#fbbf24}
.reset{padding:12px 32px;border-radius:10px;border:none;background:#ef4444;color:white;font-weight:600;cursor:pointer;font-size:15px;margin-top:16px}
</style>
</head>
<body>
<header>
<img src="/static/logos/ans_games.svg" alt="Games"><h1>❌ Tres en Línea</h1>
<a href="/games">← Panel</a>
</header>
<div class="content">
<div class="score">
<div>❌ <b id="score-x">0</b></div>
<div>🤝 <b id="score-d">0</b></div>
<div>⭕ <b id="score-o">0</b></div>
</div>
<div class="status" id="status">Tu turno (❌)</div>
<div class="board" id="board"></div>
<button class="reset" onclick="initGame()">🔄 Reiniciar</button>
</div>
<script>
let b=['','','','','','','','',''],xTurn=true,sX=0,sO=0,sD=0;
function initGame(){b=['','','','','','','','',''];xTurn=true;render();document.getElementById('status').textContent='Tu turno (❌)'}
function render(){const brd=document.getElementById('board');brd.innerHTML='';b.forEach((v,i)=>{const c=document.createElement('div');c.className='cell'+(v?' taken':'');c.textContent=v==='X'?'❌':v==='O'?'⭕':'';c.onclick=()=>move(i);brd.appendChild(c)})}
function move(i){if(b[i]||!xTurn)return;b[i]='X';xTurn=false;render();if(check('X')){end('🎉 Ganaste!','x');return}if(b.every(v=>v)){end('🤝 Empate','d');return}
document.getElementById('status').textContent='AI piensa...';setTimeout(()=>{const e=b.reduce((a,v,i)=>v===''?[...a,i]:a,[]);if(e.length){b[e[Math.floor(Math.random()*e.length)]]='O';render()}
if(check('O')){end('😵 Perdiste!','o');return}if(b.every(v=>v)){end('🤝 Empate','d');return}xTurn=true;document.getElementById('status').textContent='Tu turno (❌)'},400)}
function check(p){return[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(a=>a.every(i=>b[i]===p))}
function end(msg,s){document.getElementById('status').textContent=msg;if(s==='x')sX++;if(s==='o')sO++;if(s==='d')sD++;document.getElementById('score-x').textContent=sX;document.getElementById('score-o').textContent=sO;document.getElementById('score-d').textContent=sD;const cur=parseInt(localStorage.getItem('ans_score_tictac')||'0');if(sX>cur)localStorage.setItem('ans_score_tictac',sX);xTurn=true;fetch('/api/tokens/complete-mission',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mission:'use_games'})}).catch(()=>{});setTimeout(initGame,2000)}
initGame()
</script>
</body>
</html>
