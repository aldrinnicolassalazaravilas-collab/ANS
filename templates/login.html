<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANS AI | Iniciar Sesion</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #070b14;
            --panel: #0f1624;
            --line: rgba(120, 145, 180, 0.15);
            --text: #e8eef8;
            --muted: #98a8c3;
            --accent: #57a6ff;
            --accent-2: #34d399;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at top left, rgba(87, 166, 255, 0.18), transparent 30%),
                radial-gradient(circle at bottom right, rgba(52, 211, 153, 0.12), transparent 28%),
                linear-gradient(180deg, #050810 0%, #090d16 100%);
            font-family: "Inter", "Segoe UI", sans-serif;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(180deg, rgba(19, 28, 47, 0.95), rgba(10, 15, 26, 0.95));
            border: 1px solid var(--line);
            border-radius: 28px;
            padding: 40px 32px;
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.5);
            animation: cardIn .5s cubic-bezier(.4,0,.2,1);
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(20px) scale(.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-logo {
            width: 72px; height: 72px;
            margin: 0 auto 20px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(87, 166, 255, 0.15), rgba(52, 211, 153, 0.10));
            border: 1.5px solid rgba(87, 166, 255, 0.2);
            display: grid; place-items: center;
            font-size: 34px;
        }

        .login-title {
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #57a6ff, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 32px;
        }

        .google-btn {
            width: 100%;
            padding: 14px 20px;
            border-radius: 14px;
            border: 1.5px solid rgba(255, 255, 255, 0.10);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all .25s cubic-bezier(.4,0,.2,1);
            text-decoration: none;
        }

        .google-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.18);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .google-btn:active { transform: scale(.98); }
        .google-btn svg { flex-shrink: 0; }

        .login-footer {
            text-align: center;
            margin-top: 28px;
            font-size: 12px;
            color: rgba(152, 168, 195, 0.5);
        }

        .login-footer a {
            color: var(--accent);
            text-decoration: none;
        }

        .login-footer a:hover { text-decoration: underline; }

        .loader {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: var(--muted);
            font-size: 13px;
        }

        .loader.show { display: block; }

        .loader-dots {
            display: inline-flex;
            gap: 4px;
            margin-left: 8px;
        }

        .loader-dots span {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--accent);
            animation: dotLoad .8s infinite;
        }

        .loader-dots span:nth-child(2) { animation-delay: .15s; }
        .loader-dots span:nth-child(3) { animation-delay: .3s; }

        @keyframes dotLoad {
            0%, 80%, 100% { opacity: .3; transform: translateY(0); }
            40% { opacity: 1; transform: translateY(-4px); }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">🧠</div>
        <h1 class="login-title">ANS AI</h1>
        <p class="login-subtitle">Inicia sesion con Google para acceder al workspace de inteligencia artificial</p>

        <button class="google-btn" id="google-btn">
            <svg viewBox="0 0 24 24" width="20" height="20">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Continuar con Google
        </button>

        <div class="loader" id="loader">
            Conectando con Google
            <span class="loader-dots"><span></span><span></span><span></span></span>
        </div>

        <div class="login-error" id="login-error" style="display:none;margin-top:16px;padding:10px 14px;border-radius:10px;background:rgba(255,87,87,0.1);border:1px solid rgba(255,87,87,0.2);color:#ff6b6b;font-size:13px;text-align:center;">
            No se pudo conectar con Google. Si usas <strong>iOS Safari</strong>, intenta con <strong>Chrome</strong> o <strong>Firefox</strong>.
        </div>

        <div class="login-footer">
            Creado por <a href="/inicio">Aldrin Nicolas Salazar Avilas</a>
        </div>
    </div>

    <script>
        (function() {
            var btn = document.getElementById('google-btn');
            var loader = document.getElementById('loader');
            var error = document.getElementById('login-error');
            var isMobile = /Mobi|Android|iPhone|iPad|iPod|Opera Mini|IEMobile/i.test(navigator.userAgent);

            function iniciarGoogle() {
                loader.style.display = 'block';
                error.style.display = 'none';
                // Use window.location for mobile compatibility
                window.location.href = '/auth/google/login';
            }

            btn.addEventListener('click', iniciarGoogle);
            btn.addEventListener('touchend', function(e) {
                e.preventDefault();
                iniciarGoogle();
            });

            // Check for callback error (redirected back with error)
            if (window.location.search.includes('error') || window.location.hash.includes('error')) {
                error.style.display = 'block';
            }

            // Show a hint on iOS
            if (isMobile && /iP(hone|ad|od)/i.test(navigator.userAgent)) {
                var hint = document.createElement('div');
                hint.style.cssText = 'margin-top:16px;padding:8px 12px;border-radius:8px;background:rgba(87,166,255,0.08);color:var(--muted);font-size:12px;text-align:center;';
                hint.textContent = '💡 Si el botón no responde, abre en Chrome o Firefox.';
                btn.parentNode.insertBefore(hint, btn.nextSibling);
            }
        })();
    </script>
</body>
</html>
